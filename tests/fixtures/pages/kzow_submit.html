<!DOCTYPE html>
<html>
<head><title>Music Submissions | KZOW 98.3 FM</title></head>
<body>
  <h1>Submit Your Music</h1>
  <p>KZOW accepts music submissions from independent artists year-round.</p>
  <p>Email streaming links to the Music Director at
     <a href="mailto:music@kzow.example">music@kzow.example</a>.</p>
  <p>Please allow six weeks for review. No attachments — mp3 links only.
     No phone calls about submissions, please.</p>
  <form action="/submit-music" method="post">
    <label>Artist name <input type="text" name="artist"></label>
    <label>Track URL <input type="text" name="track"></label>
    <button type="submit">Send</button>
  </form>
</body>
</html>
